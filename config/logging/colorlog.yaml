# @package _global_
hydra:
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(log_color)s[%(asctime)s] %(levelname)-7s %(name)s:%(lineno)d%(reset)s → %(message)s"
        datefmt: "%H:%M:%S"
        class: colorlog.ColoredFormatter
        log_colors:
          DEBUG: cyan
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: bold_red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]
    loggers:
      hydra:
        level: WARNING
      hydra._internal:
        level: WARNING
    disable_existing_loggers: false

  hydra_logging:
    version: 1
    formatters:
      simple:
        format: "%(log_color)s[%(asctime)s] %(levelname)-7s %(name)s:%(lineno)d%(reset)s → %(message)s"
        datefmt: "%H:%M:%S"
        class: colorlog.ColoredFormatter
        log_colors:
          DEBUG: cyan
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: bold_red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]
    loggers:
      hydra:
        level: WARNING
      hydra._internal:
        level: WARNING
    disable_existing_loggers: false
